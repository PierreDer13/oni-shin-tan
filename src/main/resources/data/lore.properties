# A short history note for each card, shown in its own box beside the card's big copy (CardLore).
# One line per card: card id = text. UTF-8.

unsui = Unsui, "cloud and water", is the name for Zen trainee monks, who wander from temple to temple like drifting clouds and flowing water in search of a teacher.
jushoku = The jūshoku is the head priest who lives in a Buddhist temple and runs it, caring for its graves, its rites and the families of the parish.
shike = In Zen temples, the shike is the master who guides the monks in meditation and kōan practice, testing their understanding in private interviews.
inasaku-noka = Rice farmers were the backbone of Edo Japan: wealth itself was counted in koku of rice, and a lord's rank depended on his domain's harvest.
kyabetsu-noka = Cabbage came to Japan with Dutch traders but was long grown only as an ornament; it became a field crop in the Meiji era. This farmer is ahead of his time.
ikareru-hyakusho = Crushing taxes and famine sparked thousands of peasant uprisings (hyakushō ikki) in the Edo period, villagers rising with sickles and bamboo spears.
katana-kaji = Swordsmiths folded and hammered tamahagane steel many times, then coated the blade in clay so the edge hardened while the spine stayed supple.
togeika = Japanese potters prized imperfection: tea masters loved rough Raku and Bizen ware, and a crack mended with gold (kintsugi) could make a bowl more precious.
sendaiku = Shipwrights built the wooden bezaisen cargo ships that carried rice and goods along Japan's coasts while large ocean-going ships were restricted.
sakana-uri = Fishmongers shouted their wares through Edo's streets with baskets on a shoulder pole, carrying fish from the Nihonbashi market every morning.
monogoi = Beggars were part of Edo street life; many were wandering entertainers or pilgrims who sang, prayed or performed for a few coins.
hakahori = Work tied to death was thought impure, so in Edo Japan the digging of graves fell to outcast communities at the bottom of society.
ronin = A rōnin, "wave man", was a samurai without a master, drifting like a wave on the sea; the long Edo peace left tens of thousands of them without work.
goze = Goze were blind women musicians who travelled the countryside in groups, singing ballads to the shamisen in exchange for food and a place to sleep.
komuso = Komusō were begging monks of the Fuke sect who wore a basket over their whole head and played the shakuhachi flute; the disguise was said to suit spies.
taiko-uchi = Taiko drums were beaten on the battlefield to signal and pace the troops, and at festivals to call the gods.
miko = Miko are shrine maidens who serve the kami: they assist the priests, perform sacred kagura dances and, in ancient times, gave oracles in trance.
yamabushi = Yamabushi, "those who sleep in the mountains", are ascetics of Shugendō who train under waterfalls and on sacred peaks, blowing conch shells as they go.
onmyoji = Onmyōji practised onmyōdō, a court art of divination, calendars and exorcism; the most famous, Abe no Seimei, served the Heian emperors.
maiko = Maiko are the apprentice geiko of Kyoto, known by their long trailing obi and elaborate hair, who train for years in dance, music and conversation.
ueta-rikishi = Sumo wrestlers build their mass on chanko-nabe stew, and the lowest-ranked eat only after their seniors: a young rikishi is often a hungry one.
yokozuna = Yokozuna is the highest rank in sumo, named after the thick rope worn around the waist, braided like the shimenawa that marks sacred places.
ashigaru = Ashigaru, "light feet", were foot soldiers recruited from peasants; armed with spears and later matchlock guns, they decided many Sengoku battles.
hatamoto = Hatamoto, "under the banner", were the shogun's direct vassals: samurai close enough to guard their lord's standard in battle.
daimyo = Daimyō were the great lords who ruled domains of 10,000 koku or more; under the Tokugawa they had to live every other year in Edo.
genin = In ninja lore, genin were the low-ranking agents who carried out the missions in the field, under orders from the chūnin and jōnin.
jonin = Jōnin were said to lead the ninja clans, planning missions and hiring out their agents while rarely being seen themselves.
onnagata = Onnagata are male kabuki actors who play women's roles: women were banned from the kabuki stage in 1629, and the art of the onnagata grew from it.
yumihiki = Archery was the samurai's first art: the early warriors were mounted archers, and "the way of the bow and horse" came before the way of the sword.
jujutsu-shihan = Jujutsu masters taught unarmed fighting to bring down an armoured enemy. The Honjō Masamune, a legendary blade by the smith Masamune, has been lost since 1945.
fuma-kotaro = Fūma Kotarō led the Fūma ninja who served the Hōjō clan; legend makes him a giant who raided enemy camps by night until the soldiers fought each other in the dark.
shogun = The shōgun, "commander who subdues the barbarians", was Japan's military ruler; from 1603 to 1867 the Tokugawa shoguns governed from Edo.
tenno = The Tennō, the emperor, is said to descend from the sun goddess Amaterasu; under the shoguns he reigned in Kyoto with great prestige but little power.
kappa = Kappa are river yōkai with a dish of water on their head; they drag people into the water, but bow to one politely and it bows back, spilling its strength.
tengu = Tengu are mountain yōkai, once bird-like demons, later long-nosed masters of martial arts; legend says they trained the young Minamoto no Yoshitsune.
noppera-bo = The noppera-bō is a faceless yōkai: it looks like an ordinary person until it turns around, showing a face as smooth as an egg.
rokurokubi = A rokurokubi looks like a normal woman by day, but at night her neck stretches to great lengths so her head can wander through the house.
jorogumo = The jorōgumo is a spider that takes the shape of a beautiful woman to lure men to her home, where she binds them in silk.
oiwa = Oiwa is the vengeful ghost of the kabuki play Yotsuya Kaidan (1825): poisoned and betrayed by her husband, she comes back with a ruined face to haunt him.
nue = The nue is a chimera with a monkey's face, a tanuki's body, a tiger's legs and a snake for a tail; the archer Minamoto no Yorimasa shot one down over the imperial palace.
shinigami = Shinigami, gods of death, are late arrivals in Japanese folklore: they appear in Edo-period tales and rakugo stories, luring people towards their end.
enma = Enma is the king of hell in Japanese Buddhism, who judges the dead and decides their next life; liars may have their tongue pulled out.
kitsune-no-bakashiya = Kitsune are foxes who gain magic as they age, growing up to nine tails; the tricksters among them take human form to fool people.
kitsune-no-tsukai = White foxes are the messengers of Inari, the kami of rice: fox statues guard every Inari shrine, often holding a key or a jewel in their mouth.
kodama = Kodama are the spirits that live in old trees; an echo in the mountains was a kodama answering, and cutting down its tree brought misfortune.
raijin = Raijin, the god of thunder, beats a ring of drums to make the thunder roll; children were told to cover their navels, which he liked to eat.
fujin = Fūjin, the god of wind, carries a bag of winds on his shoulders; he and Raijin are often painted together, as on Tawaraya Sōtatsu's famous screens.
ryu = Japanese dragons are water gods of rain, rivers and the sea; Ryūjin, the dragon king, lives in a palace beneath the waves.
inari-okami = Inari Ōkami is the kami of rice, harvest and prosperity, one of the most worshipped in Japan: about a third of all shrines are dedicated to Inari.
amaterasu-omikami = Amaterasu is the sun goddess; when she hid in a cave, the world went dark until the gods lured her out with a mirror and a joyful dance.
tsukuyomi = Tsukuyomi is the moon god, Amaterasu's brother; after he killed the food goddess, Amaterasu refused to see him again, which is why day and night are apart.
takemikazuchi = Takemikazuchi is a god of thunder and swords who subdued the land for the heavenly gods; his sword Futsu-no-mitama is enshrined at Isonokami Shrine.
okuninushi = Ōkuninushi is the kami who built and ruled the land of Izumo; he healed the White Hare of Inaba with fresh water and cattail pollen.
susanoo = Susanoo is the storm god, Amaterasu's wild brother; banished from heaven, he slew the serpent Yamata no Orochi and found the sword Kusanagi in its tail.
izanami = Izanami created the islands of Japan with Izanagi; she died giving birth to the fire god and became the queen of Yomi, the land of the dead.
saru = Monkeys are messengers of the mountain gods; the three wise monkeys carved at Nikkō Tōshō-gū "see no evil, hear no evil, speak no evil".
koi = A koi that swims up a waterfall becomes a dragon, says a legend from China; carp streamers fly on Children's Day so boys grow strong and determined.
kiji = The green pheasant is Japan's national bird; in the tale of Momotarō, a pheasant joins the dog and the monkey to fight the oni of Onigashima.
kame = Turtles stand for long life, said to live ten thousand years; in the tale of Urashima Tarō, a turtle he saved carries the fisherman to the Dragon Palace.
tsuru = Cranes are said to live a thousand years, and folding a thousand paper cranes, senbazuru, is believed to grant a wish.
tanuki = Tanuki are the raccoon dogs of folklore, cheerful shapeshifters who turn into people or teakettles; their statues welcome customers outside shops and inns.
tora = Tigers never lived in Japan: painters drew them from skins and imported pictures, which is why many old Japanese tigers look like big cats.
kawarimi = Kawarimi no jutsu, the body-swap technique: the ninja leaves a log or a decoy in his place, and the blow lands on it.
makibishi = Makibishi are caltrops, spiked iron or dried water-chestnut seeds that a fleeing ninja scattered behind him to slow his pursuers.
oyasumi = Oyasumi means "good night"; ninja lore tells of sleeping powders and drugged incense used to put the guards to sleep before a raid.
otoshiana = Otoshiana are pitfall traps, dug and hidden on the roads and approaches to a castle to catch the unwary.
shikomi-andon = A shikomi weapon hides a blade inside an everyday object, like a cane or a pipe; this paper lantern hides a nasty surprise.
dondengaeshi = Dondengaeshi is a kabuki stage trick where the set flips backwards to reveal a new scene; ninja houses were said to have revolving walls built the same way.
heiwa-no-torii = The Heiwa no Torii, "torii of peace", of Hakone Shrine stands in Lake Ashi; it was raised in 1952 for the peace treaty and the crown prince's coming of age.
meiji-otorii = The great torii of Meiji Jingū in Tokyo is one of Japan's largest wooden torii, made from a cypress more than 1,500 years old.
itsukushima = Itsukushima Shrine on Miyajima is built over the sea: at high tide its great vermilion torii seems to float on the water.
kumano-hongu-taisha = Kumano Hongū Taisha heads the three grand shrines of Kumano, reached by the Kumano Kodō pilgrim roads; its symbol is Yatagarasu, the three-legged crow.
fushimi-inari = Fushimi Inari Taisha in Kyoto is Inari's head shrine; thousands of vermilion torii given by businesses form tunnels up Mount Inari.
motonosumi-shrine = Motonosumi Jinja in Yamaguchi is famous for its 123 red torii winding down the cliff to the sea, and for an offering box set high on the great torii.
bakeneko = Bakeneko are cats that turn into yōkai when they grow old: they walk on two legs, speak, and some lick the lamp oil at night.
gagoze = Gagoze is the oni said to haunt the bell tower of Gangō-ji temple in Nara, until a boy of great strength tore off its hair and drove it away.
hinoeuma = Hinoeuma, the year of the Fire Horse, comes every 60 years; women born then were said to be headstrong, and births in Japan fell by a quarter in 1966.
tatari = A tatari is a curse sent by an angry spirit; the exiled scholar Sugawara no Michizane was believed to strike Kyoto with lightning and plague after his death.
gaki = Gaki are the hungry ghosts of Buddhism, souls punished for their greed, with swollen bellies and needle-thin throats so they can never eat their fill.
gokiburi = The name gokiburi comes from a misprint: the old name gokaburi, the "bowl crawler", lost a syllable in a textbook of 1884, and the mistake stuck.
rite-of-shokan = Shōkan means "summoning"; in Japanese tradition the spirits of the ancestors watch over their descendants, who honour them at the family altar.
rite-of-gokito = Gokitō are prayers said at a temple or shrine for one precise wish: safety, health, success, or protection from misfortune.
rite-of-ujigami-mairi = Ujigami are the guardian kami of a clan or a village; newborn babies are brought to the local shrine to be presented to them.
rite-of-daijosai = The Daijōsai is the great harvest rite held once in each emperor's reign, when the new emperor offers the first rice to the gods.
rite-of-sanpasen = Ancestor rites mark the life of every household: offerings of food, incense and prayer keep the dead close and their blessing on the living.
rite-of-mukaebi = Mukaebi, the "welcoming fire", is lit at the start of Obon so the spirits of the ancestors find their way home; the okuribi later sends them back.
kakuremino = The kakuremino is a magic straw cloak that makes its wearer invisible; in folk tales oni and tengu own one, and clever heroes trick them out of it.
kemuri-dama = Kemuri-dama are smoke bombs, packed with gunpowder and ash, that ninja used to blind their enemies and vanish.
kuji-in = Kuji-in are the nine hand seals of esoteric Buddhism, Rin, Pyō, Tō, Sha, Kai, Jin, Retsu, Zai, Zen; ninja lore says they steadied the mind before danger.
yoi = Yōi means "ready": the word that starts races and archery contests, the moment of preparation before every action.
chiburi = Chiburi is the sharp flick of the sword that throws the blood off the blade before it goes back into the scabbard.
iaido = Iaidō is the art of drawing the sword and cutting in a single motion, to answer a sudden attack.
ketto = The most famous duel in Japan, Miyamoto Musashi against Sasaki Kojirō on Ganryūjima in 1612, ended with a single blow of a wooden sword carved from an oar.
yoroi = Samurai armour, yoroi, was made of small lacquered plates laced together with silk cords, light enough for a mounted archer to move in.
harae = Harae is Shintō purification: the priest waves a haraegushi wand to sweep away the impurity, kegare, that keeps the kami's blessing away.
kiseki = Kiseki means "miracle"; Japan's temples and shrines keep countless stories of healings and wonders granted to the faithful.
senbon-torii = Senbon Torii, the "thousand torii", is the tunnel of gates at Fushimi Inari; there are in fact around ten thousand of them across the mountain.
taisha-zukuri = Taisha-zukuri is the oldest style of shrine building, seen at Izumo Taisha, Ōkuninushi's shrine, whose ancient hall is said to have stood 48 metres high.
kagura = Kagura is the sacred music and dance performed for the kami; legend says it began with the dance that drew Amaterasu out of her cave.
kuchiyose = Kuchiyose is the art of calling a spirit: at Mount Osore, blind mediums called itako still speak with the voices of the dead.
kamikakushi = Kamikakushi, "hidden by the gods", is what people said when someone vanished without a trace: taken by tengu, foxes or the kami themselves.
sakasama = Sakasama means "upside down"; at funerals a folding screen is set upside down beside the dead, a sign that the other world works backwards.
tamashii-gui = Tamashii-gui, the soul eater: Japanese tales tell of demons and yōkai that feed on the spirits of the living and the dead.
shuriken-uchi = Shuriken are small hidden blades, stars or spikes, thrown to distract or wound; shuriken-jutsu was taught as a minor art beside the sword.
kagemusha = A kagemusha, "shadow warrior", was a lord's double used as a decoy; legend says Takeda Shingen's death was hidden for three years behind one.
suiton-no-jutsu = Suiton no jutsu, the water escape: in ninja lore, hiding underwater and breathing through a bamboo tube until the pursuers give up.
zeni-nage = Zenigata Heiji, a famous detective of Edo fiction, throws coins at criminals; real Edo coins had a hole in the middle so they could be strung together.
shishimai = Shishimai is the lion dance of New Year and festivals; being "bitten" by the lion's head brings good luck and drives evil away.
kotodama = Kotodama is the belief that words hold a spirit: saying something can make it happen, so words of misfortune are avoided at weddings.
gashadokuro = The gashadokuro is a giant skeleton made from the bones of people who died of hunger or in battle; it wanders at night, its teeth chattering.
chimatsuri = Chimatsuri, the "blood festival", was the old custom of killing a captured enemy before battle as an offering to the gods of war.
omukade = The ōmukade is the giant centipede of Mount Mikami; the hero Tawara Tōta killed it for the dragon king of Lake Biwa with an arrow dipped in his saliva.
totsugeki = Totsugeki means "charge": Sengoku armies broke the enemy lines with massed spear charges once the archers and gunners had done their work.
mamori-shu = The mamori-shū were guards posted at the castle gates and around their lord, ready to shield him with their lives.
kosho = Koshō were young pages serving a great lord; many became trusted officers, like Mori Ranmaru, who died beside Oda Nobunaga at Honnō-ji.
matsunaga-hisahide = Matsunaga Hisahide betrayed lord after lord in the Sengoku era; besieged by Oda Nobunaga in 1577, legend says he blew himself up with his prized tea kettle.
oishi-kuranosuke = Ōishi Kuranosuke led the 47 rōnin of Akō: he played the drunkard for almost two years to fool his enemy's spies, then avenged his lord at the end of 1702.
akechi-mitsuhide = Akechi Mitsuhide turned on his lord Oda Nobunaga at Honnō-ji in 1582 and was beaten within two weeks; his short rule became the saying "three days in power".
kunisada-chuji = Kunisada Chūji was a gambler and outlaw boss of Jōshū who defied the authorities and handed out rice during a famine; he was crucified in 1850 and became a folk hero.
izanagi = Izanagi created the islands of Japan with Izanami; he followed her to the land of the dead, broke his promise not to look at her, and fled, sealing the way with a boulder.
takeda-shingen = Takeda Shingen, the Tiger of Kai, took power by exiling his own father; his banner bore Sun Tzu's words "swift as the wind, quiet as the forest, fierce as fire, still as the mountain".
yamata-no-orochi = Yamata no Orochi is the eight-headed, eight-tailed serpent of Izumo; Susanoo made it drunk on strong sake, cut it apart and found the sword Kusanagi inside.
