# Construit le jeu pour Windows, macOS et Linux (Java intégré)
# et ajoute les 3 zips à la Release "oni-shin-tan-v1.0" du portfolio.
# Lancement manuel : onglet Actions → "Release builds" → Run workflow
name: Release builds

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest      # Mac Apple Silicon (M1, M2…)
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the jar and copy its dependencies
        run: |
          mvn -B package -DskipTests
          mvn -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/libs
          cp target/oni-shin-tan-0.1.0.jar target/libs/

      - name: Package with jpackage (app + its own Java)
        run: |
          jpackage --type app-image --name OniShinTan --dest target/dist \
            --input target/libs --main-jar oni-shin-tan-0.1.0.jar \
            --main-class fr.onishintan.ui.OniShinTanApp \
            --java-options '--module-path $APPDIR --add-modules javafx.controls,javafx.media'

      - name: Zip
        run: |
          cd target/dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../../OniShinTan-windows.zip OniShinTan
          elif [ "${{ matrix.name }}" = "macos" ]; then
            ditto -c -k --keepParent OniShinTan.app ../../OniShinTan-macos.zip
          else
            zip -qr ../../OniShinTan-linux.zip OniShinTan
          fi

      - name: Upload to the portfolio release
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: gh release upload oni-shin-tan-v1.0 OniShinTan-${{ matrix.name }}.zip --clobber --repo PierreDer13/PortFolio
