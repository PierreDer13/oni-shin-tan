# Construit le jeu pour Windows, macOS et Linux (Java intégré) et publie les 3 zips :
#  1. dans la Release "latest" de CE dépôt (liens communs, utilisables par Pierre ET Kayne) :
#     https://github.com/PierreDer13/oni-shin-tan/releases/latest/download/OniShinTan-<os>.zip
#  2. dans la Release du portfolio de Pierre (si le secret PORTFOLIO_TOKEN existe)
# Lancement manuel : onglet Actions → "Release builds" → Run workflow
name: Release builds

on:
  workflow_dispatch:

# Autorise le GITHUB_TOKEN automatique à créer/modifier les Releases de ce dépôt
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest      # Mac Apple Silicon (M1, M2…)
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      # Vaut 'true' seulement si le secret existe (sinon l'envoi au portfolio est sauté)
      HAS_PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN != '' }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the jar and copy its dependencies
        run: |
          mvn -B package -DskipTests
          mvn -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/libs
          cp target/oni-shin-tan-0.1.0.jar target/libs/

      - name: Package with jpackage (app + its own Java)
        run: |
          jpackage --type app-image --name OniShinTan --dest target/dist \
            --input target/libs --main-jar oni-shin-tan-0.1.0.jar \
            --main-class fr.onishintan.ui.OniShinTanApp \
            --java-options '--module-path $APPDIR --add-modules javafx.controls,javafx.media'

      - name: Zip
        run: |
          cd target/dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../../OniShinTan-windows.zip OniShinTan
          elif [ "${{ matrix.name }}" = "macos" ]; then
            ditto -c -k --keepParent OniShinTan.app ../../OniShinTan-macos.zip
          else
            zip -qr ../../OniShinTan-linux.zip OniShinTan
          fi

      - name: Upload to this repository's release (shared links)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0 --repo ${{ github.repository }} >/dev/null 2>&1 \
            || gh release create v1.0 --repo ${{ github.repository }} --title "Oni Shin Tan v1.0" --notes "Windows, macOS and Linux builds (Java bundled)." --latest || true
          gh release upload v1.0 OniShinTan-${{ matrix.name }}.zip --clobber --repo ${{ github.repository }}

      - name: Upload to Pierre's portfolio release
        if: ${{ env.HAS_PORTFOLIO_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: gh release upload oni-shin-tan-v1.0 OniShinTan-${{ matrix.name }}.zip --clobber --repo PierreDer13/PortFolio
